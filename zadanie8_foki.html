<!DOCTYPE html>
<head>
<script type="text/javascript">
function show_confirm()
{
var r=confirm("Naciśnij klawisz");
if (r==true)
{ document.write("Nacisnąłeś OK!"); }
else
{ document.write("Nacisnąłeś Cancel!"); }
}
function okno_zamknij() 
                 { 
                   window.close() 
                 }
</script>
</head>
<body>
<p><b>Zastosowanie:</b><br>
Jest używany, jeśli chcemy zapytać użytkownika o weryfikacje, lub akceptację jakichś danych.<br>
Użytkownik musi nacisnąć „OK.” w celu akceptacji bądź „Cancel” w celu odrzucenia.<br> Jeżeli zostanie
wybrane „OK.” metoda zwraca true w przeciwnym wypadku false.<br></p>
<input type="button" onclick="show_confirm()" value="Pokaż Confirm Box" /><br><br>
<input type="button" value="zamknij okno" onclick="okno_zamknij()"/>
</body>
</html>
